<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>Plate Pusher v1.1</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ===== Plate Pusher theme: the Frame Pusher v2 neon tokens, surfaces and controls ===== */
:root{--neon2:#0891b2;--neon3:#c026d3;--glow:rgba(138,43,226,.30);--r:10px;--bg:#f0eafc;--panel:#fcfaff;--ink:#1a1033;--mut:#68589a;--line:#d5c4f6;--mem:#2a1b52;--acc:#8a2be2;--grid:#dfd2fa;--plate:#e6dcfb;--sh:0 12px 30px -14px rgba(90,20,160,.5),0 0 0 1px rgba(138,43,226,.10);--sh-s:0 1px 2px rgba(60,20,120,.12);color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;--neon2:#19f0ff;--neon3:#ff2bd6;--glow:rgba(180,76,255,.5);--bg:#09050f;--panel:#110a20;--ink:#ece6ff;--mut:#9d90c9;--line:#2c1e52;--mem:#e9e0ff;--acc:#b44cff;--grid:#180f2c;--plate:#1d1236;--sh:0 16px 44px -14px rgba(0,0,0,.85),0 0 0 1px rgba(180,76,255,.24),0 0 30px -8px rgba(180,76,255,.5);--sh-s:none}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--acc) 60%,transparent) transparent}
html,body{height:100%;margin:0}html{-webkit-font-smoothing:antialiased}
body{background:radial-gradient(900px 500px at 12% -8%,color-mix(in srgb,var(--acc) 14%,transparent),transparent),var(--bg);color:var(--ink);font:13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.005em;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);overflow:hidden}
::selection{background:color-mix(in srgb,var(--neon3) 45%,transparent);color:inherit}
button{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:color-mix(in srgb,var(--acc) 5%,var(--panel));border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer;letter-spacing:.015em;transition:background .12s,border-color .12s,color .12s,box-shadow .12s}
button:hover{border-color:var(--neon2);color:var(--ink);background:color-mix(in srgb,var(--neon2) 9%,var(--panel));box-shadow:0 0 0 1px color-mix(in srgb,var(--neon2) 55%,transparent),0 0 16px -3px color-mix(in srgb,var(--neon2) 60%,transparent)}
button:active{transform:translateY(.5px)}button:focus-visible{outline:2px solid var(--neon2);outline-offset:1px}
button.on,button.on:hover{background:linear-gradient(135deg,var(--acc),var(--neon3));border-color:transparent;color:#fff;box-shadow:0 0 18px -2px color-mix(in srgb,var(--neon3) 70%,transparent)}
button:disabled{opacity:.4;cursor:default}
button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
label{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
input[type=range]{accent-color:var(--neon3)}input[type=checkbox],input[type=radio]{accent-color:var(--acc)}
select,input[type=text],input[type=number],textarea{background:color-mix(in srgb,var(--acc) 5%,var(--bg));color:var(--ink);border:1px solid color-mix(in srgb,var(--acc) 30%,var(--line));border-radius:8px;font:inherit;padding:5px 8px;transition:border-color .12s,box-shadow .12s}
select:focus,input[type=text]:focus,input[type=number]:focus,textarea:focus{outline:none;border-color:var(--neon2);box-shadow:0 0 0 3px color-mix(in srgb,var(--neon2) 22%,transparent),0 0 14px -2px color-mix(in srgb,var(--neon2) 50%,transparent)}
a{color:var(--neon2)}
kbd{display:inline-block;min-width:1.5em;padding:0 5px;margin:0 1px;font:600 10.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px}
/* top bar */

#top .tt{background:linear-gradient(90deg,var(--acc),var(--neon3) 55%,var(--neon2));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-transform:uppercase;letter-spacing:.12em;font-weight:800;font-size:12.5px;white-space:nowrap;margin-right:6px}

#top button:hover{background:color-mix(in srgb,var(--neon2) 10%,transparent);border-color:color-mix(in srgb,var(--neon2) 70%,transparent);color:var(--ink);box-shadow:0 0 14px -3px color-mix(in srgb,var(--neon2) 65%,transparent)}

#tools button svg{width:17px;height:17px}

.gh::before{content:"";flex:none;width:14px;height:2px;background:linear-gradient(90deg,var(--neon3),var(--neon2));box-shadow:0 0 8px var(--neon2)}
#tools .preRow{display:flex;gap:4px}#tools .preRow select{flex:1;min-width:0}#tools .preRow button{width:auto;flex:none;justify-content:center}
.prop{display:grid;grid-template-columns:minmax(0,1fr) 92px 34px;align-items:center;gap:4px 6px;font-size:12px;padding:2px 2px}
.prop span{color:var(--ink)}.prop i{font-style:normal;color:var(--mut);font-size:11px}.prop input,.prop select{width:100%;min-width:0;padding:3px 6px;font-size:12px}
.prop select.w2{grid-column:2/4}.prop .rng{grid-column:1/-1;width:100%}
.pnote{font-size:11px;color:var(--mut);line-height:1.4;padding:0 2px}
/* canvas area */
main{min-width:0;min-height:0;display:flex;flex-direction:column}
#mid{flex:1;min-height:0;display:flex}
#wrap{flex:1;min-width:0;min-height:0;position:relative;overflow:hidden}
canvas#cv{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}

#dock>*{pointer-events:auto}
.card{background:var(--panel);border:1px solid color-mix(in srgb,var(--acc) 55%,var(--line));border-radius:var(--r);box-shadow:var(--sh)}
#dsb{width:250px;overflow:hidden;font-size:12px}#dsb>button{width:100%;background:transparent;border:0;box-shadow:none;border-radius:0;padding:8px 12px;font-size:12px;font-weight:600;justify-content:space-between}
#dsB{padding:2px 12px 10px}#dsB[hidden]{display:none}.dsr{display:grid;grid-template-columns:86px minmax(0,1fr) 42px;align-items:center;gap:8px;margin:4px 0}.dsr input{width:100%;min-width:0;margin:0}.dsr b{font-weight:600;color:var(--mut);font-size:11px;text-align:right}
#lgd{padding:8px 10px;font-size:11.5px;width:250px}#lgd[hidden]{display:none}#lgd .lt{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;display:flex;justify-content:space-between;gap:6px}#lgd .lt i{font-style:normal;color:var(--mut);text-transform:none;letter-spacing:0;font-weight:500}

.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{flex:1 1 0;min-width:0;justify-content:center;border:0;border-radius:0;box-shadow:none;padding:5px 4px;font-size:11.5px;background:transparent}.seg button+button{border-left:1px solid var(--line)}.seg button.on,.seg button.on:hover{background:linear-gradient(135deg,var(--acc),var(--neon3));color:#fff}

<script>
/* ===================================================================================================
   Plate Pusher engine: mesher, elements, assembly, solver, recovery and sampling.
   Units: kN, m (E in kN/m², thickness in m). Two independent systems on the same mesh:
     • In-plane (membrane, plane stress): 2 DOF / node (u, v). Element: Q4 with Wilson–Taylor incompatible modes (QM6),
       condensed statically to 8 × 8; good in bending, passes the patch test.
     • Out-of-plane (plate bending, Reissner–Mindlin): 3 DOF / node (w, βx, βy). Element: MITC4 (Bathe–Dvorkin
       assumed transverse shear), 12 × 12; free of shear locking so it converges to Kirchhoff theory for thin plates.
   Sign conventions: z (and w) is positive in the direction of positive pressure q, i.e. "down" for gravity loads.
   βx, βy are the rotations of the normal (u = z·βx, v = z·βy); for a thin plate βx = −∂w/∂x, βy = −∂w/∂y.
   Mx = D(κx + νκy), κx = ∂βx/∂x … so sagging moments are positive. Qx = κGt(∂w/∂x + βx).
   =================================================================================================== */
const G2=1/Math.sqrt(3),GPT=[[-G2,-G2],[G2,-G2],[G2,G2],[-G2,G2]],RI=[-1,1,1,-1],SI=[-1,-1,1,1];
function shp(r,s){return[.25*(1-r)*(1-s),.25*(1+r)*(1-s),.25*(1+r)*(1+s),.25*(1-r)*(1+s)]}
function dshp(r,s){return[[-.25*(1-s),.25*(1-s),.25*(1+s),-.25*(1+s)],[-.25*(1-r),-.25*(1+r),.25*(1+r),.25*(1-r)]]}
function jac(X,Y,r,s){const[dr,ds]=dshp(r,s);let xr=0,yr=0,xs=0,ys=0;for(let i=0;i<4;i++){xr+=dr[i]*X[i];yr+=dr[i]*Y[i];xs+=ds[i]*X[i];ys+=ds[i]*Y[i]}
 const det=xr*ys-yr*xs,i11=ys/det,i12=-yr/det,i21=-xs/det,i22=xr/det,Nx=[],Ny=[];
 for(let i=0;i<4;i++){Nx.push(i11*dr[i]+i12*ds[i]);Ny.push(i21*dr[i]+i22*ds[i])}return{det,xr,yr,xs,ys,i11,i12,i21,i22,Nx,Ny,dr,ds}}
const zeros=(r,c)=>Array.from({length:r},()=>new Float64Array(c));
function matInv(A){const n=A.length,M=A.map((r,i)=>{const o=new Float64Array(2*n);for(let j=0;j<n;j++)o[j]=r[j];o[n+i]=1;return o});
 for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;[M[c],M[p]]=[M[p],M[c]];const d=M[c][c];for(let j=0;j<2*n;j++)M[c][j]/=d;
  for(let r=0;r<n;r++)if(r!==c){const f=M[r][c];if(f)for(let j=0;j<2*n;j++)M[r][j]-=f*M[c][j]}}return M.map(r=>r.slice(n))}
function dMat(E,nu,f){const c=E*f/(1-nu*nu);return[[c,c*nu,0],[c*nu,c,0],[0,0,c*(1-nu)/2]]}
/* K += Bᵀ D B w for B (m × n) */
const DBS=[new Float64Array(12),new Float64Array(12),new Float64Array(12)];
function addBtDB(K,B,D,w,B2){const m=B.length,n=B[0].length,B_=B2||B,n2=B_[0].length,DB=DBS;
 for(let i=0;i<m;i++){const r=DB[i];r.fill(0);for(let k=0;k<m;k++){const d=D[i][k];if(d){const bk=B_[k];for(let j=0;j<n2;j++)r[j]+=d*bk[j]}}}
 for(let a=0;a<n;a++)for(let i=0;i<m;i++){const b=B[i][a];if(b){const r=DB[i],Ka=K[a];for(let j=0;j<n2;j++)Ka[j]+=b*w*r[j]}}}

/* ---------- membrane QM6 ---------- */
const SMB=zeros(3,8),SMI=zeros(3,4);
function memB(X,Y,r,s,J0){const J=jac(X,Y,r,s),B=SMB,Bi=SMI,f=J0.det/J.det;B.forEach(x=>x.fill(0));Bi.forEach(x=>x.fill(0));
 for(let i=0;i<4;i++){B[0][2*i]=J.Nx[i];B[1][2*i+1]=J.Ny[i];B[2][2*i]=J.Ny[i];B[2][2*i+1]=J.Nx[i]}
 const p1x=J0.i11*(-2*r)*f,p1y=J0.i21*(-2*r)*f,p2x=J0.i12*(-2*s)*f,p2y=J0.i22*(-2*s)*f;
 Bi[0][0]=p1x;Bi[1][1]=p1y;Bi[2][0]=p1y;Bi[2][1]=p1x;Bi[0][2]=p2x;Bi[1][3]=p2y;Bi[2][2]=p2y;Bi[2][3]=p2x;return{J,B,Bi}}
function kMem(X,Y,mat){const D=dMat(mat.E,mat.nu,mat.t),J0=jac(X,Y,0,0),Kcc=zeros(8,8),Kci=zeros(8,4),Kii=zeros(4,4);
 for(const[r,s]of GPT){const{J,B,Bi}=memB(X,Y,r,s,J0);addBtDB(Kcc,B,D,J.det);addBtDB(Kci,B,D,J.det,Bi);addBtDB(Kii,Bi,D,J.det)}
 const Ki=matInv(Kii),R=zeros(4,8);for(let i=0;i<4;i++)for(let j=0;j<8;j++){let s=0;for(let k=0;k<4;k++)s+=Ki[i][k]*Kci[j][k];R[i][j]=s}
 const K=zeros(8,8);for(let i=0;i<8;i++)for(let j=0;j<8;j++){let s=Kcc[i][j];for(let k=0;k<4;k++)s-=Kci[i][k]*R[k][j];K[i][j]=s}
 for(let i=0;i<8;i++)for(let j=0;j<i;j++){const a=.5*(K[i][j]+K[j][i]);K[i][j]=K[j][i]=a}
 return{K,R,J0,D,Kcc}}
/* membrane resultants N = [Nx, Ny, Nxy] (kN/m) at the four Gauss points */
function memRec(X,Y,mat,el,ue){const al=new Float64Array(4);for(let i=0;i<4;i++){let s=0;for(let j=0;j<8;j++)s-=el.R[i][j]*ue[j];al[i]=s}
 return GPT.map(([r,s])=>{const{B,Bi}=memB(X,Y,r,s,el.J0),e=[0,0,0];for(let i=0;i<3;i++){let v=0;for(let j=0;j<8;j++)v+=B[i][j]*ue[j];for(let j=0;j<4;j++)v+=Bi[i][j]*al[j];e[i]=v}
  return el.D.map(row=>row[0]*e[0]+row[1]*e[1]+row[2]*e[2])})}

/* ---------- plate MITC4 ---------- */
function covRow(X,Y,r,s,dir){const N=shp(r,s),d=dshp(r,s)[dir],row=new Float64Array(12);let xa=0,ya=0;for(let i=0;i<4;i++){xa+=d[i]*X[i];ya+=d[i]*Y[i]}
 for(let i=0;i<4;i++){row[3*i]=d[i];row[3*i+1]=xa*N[i];row[3*i+2]=ya*N[i]}return row}
const SPB=zeros(3,12),SPS=zeros(2,12);
function plateB(X,Y,r,s,T){const J=jac(X,Y,r,s),Bb=SPB,Bs=SPS;Bb.forEach(x=>x.fill(0));
 for(let i=0;i<4;i++){Bb[0][3*i+1]=J.Nx[i];Bb[1][3*i+2]=J.Ny[i];Bb[2][3*i+1]=J.Ny[i];Bb[2][3*i+2]=J.Nx[i]}
 for(let j=0;j<12;j++){const gr=.5*(1+s)*T.A[j]+.5*(1-s)*T.C[j],gs=.5*(1+r)*T.D[j]+.5*(1-r)*T.B[j];Bs[0][j]=J.i11*gr+J.i12*gs;Bs[1][j]=J.i21*gr+J.i22*gs}return{J,Bb,Bs}}
function kPlate(X,Y,mat){const E=mat.E,nu=mat.nu,t=mat.t,Db=dMat(E,nu,t*t*t/12),ks=5/6*E/(2*(1+nu))*t,Ds=[[ks,0],[0,ks]],
 T={A:covRow(X,Y,0,1,0),C:covRow(X,Y,0,-1,0),B:covRow(X,Y,-1,0,1),D:covRow(X,Y,1,0,1)},K=zeros(12,12),Kb=zeros(12,12),Ks=zeros(12,12);
 for(const[r,s]of GPT){const{J,Bb,Bs}=plateB(X,Y,r,s,T);addBtDB(Kb,Bb,Db,J.det);addBtDB(Ks,Bs,Ds,J.det)}
 for(let i=0;i<12;i++)for(let j=0;j<12;j++)K[i][j]=Kb[i][j]+Ks[i][j];
 for(let i=0;i<12;i++)for(let j=0;j<i;j++){const a=.5*(K[i][j]+K[j][i]);K[i][j]=K[j][i]=a}
 return{K,Kb,Ks,T,Db,Ds,ks}}

const DESC={
 w:['w','Deflection w','How far each point moves out of the plane, positive in the direction of the load (down for gravity). It is the primary unknown of the bending problem; everything else comes from its derivatives.','Check against serviceability limits, typically span/250 overall or span/500 after finishes. The info panel reports L/w using the shorter plan dimension.'],
 bx:['beta','Rotation βx','The rotation of the plate’s normal in the x–z plane (mrad). For a thin plate βx = −∂w/∂x, the negative slope in x. Zero along clamped edges and on lines of symmetry.','Large rotations at a support show it is acting as a pin; near zero rotation means the edge is effectively fixed.'],
 by:['beta','Rotation βy','The rotation of the normal in the y–z plane (mrad); for a thin plate βy = −∂w/∂y.','Large rotations at a support show it is acting as a pin; near zero rotation means the edge is effectively fixed.'],
 Mx:['Mx','Bending moment Mx','Moment per metre width acting on sections normal to x, so it bends the plate along x. Positive is sagging (tension on the bottom face). It is the moment bars running in the x direction must resist.','Design bottom x-bars for positive Mx and top x-bars for negative Mx. With twisting present, use the Wood–Armer moments instead.'],
 My:['My','Bending moment My','Moment per metre width on sections normal to y: it bends the plate along y and governs bars running in y. Positive is sagging.','In two-way slabs the shorter span takes the larger moment; compare Mx and My to see how the load is shared.'],
 Mxy:['Mxy','Twisting moment Mxy','The torsion per metre on both faces. It is largest near corners of simply supported slabs, where the corners try to lift, and where supports are discontinuous.','Twisting must be carried by reinforcement too: it raises the design moments (Wood–Armer) and, at free corners, needs top and bottom corner steel.'],
 M1:['M12','Principal moment M1','The largest bending moment at a point, about the axis where the twisting moment vanishes. Principal vectors show its direction: the plate’s natural “spanning direction” at that point.','Use with M2 to see the moment trajectories; they bend around openings and into corners.'],
 M2:['M12','Principal moment M2','The smallest (most hogging) principal moment, at right angles to M1.','Negative M2 over supports and at re-entrant corners shows where top steel is needed.'],
 Qx:['Q','Transverse shear Qx','Shear force per metre on sections normal to x: the out-of-plane force carried towards the supports. Qx = ∂Mx/∂x + ∂Mxy/∂y.','Check against the concrete shear resistance per metre, and around columns check punching shear: the shear concentrates sharply there.'],
 Qy:['Q','Transverse shear Qy','Shear force per metre on sections normal to y. Qy = ∂My/∂y + ∂Mxy/∂x.','Check against the shear resistance; peaks occur at supports and under concentrated loads.'],
 Qv:['Q','Resultant shear |Q|','The magnitude √(Qx² + Qy²) of the transverse shear, in its own direction.','A quick map of where shear is highest; cut a section to integrate the total shear crossing a line, such as a punching perimeter.'],
 WXb:['WA','Wood–Armer Mx* bottom','The design moment for bottom bars in x, including the share of the twisting moment: Mx* = Mx + |Mxy| (corrected so that neither direction goes below zero).','Reinforce the bottom in x for Mx*; it is never less than Mx, and the extra comes from twist.'],
 WYb:['WA','Wood–Armer My* bottom','The design moment for bottom bars in y: My* = My + |Mxy| with the Wood–Armer corrections.','Reinforce the bottom in y for My*.'],
 WXt:['WA','Wood–Armer Mx* top','The design moment for top bars in x (negative = hogging): Mx* = Mx − |Mxy|, corrected so it is never positive.','Reinforce the top in x for |Mx*|; check zones near supports, columns and corners.'],
 WYt:['WA','Wood–Armer My* top','The design moment for top bars in y: My* = My − |Mxy|, never positive.','Reinforce the top in y for |My*|.'],
 sb:['sb','Bending stress σx (surface)','The elastic stress at the bottom surface from Mx: σ = 6Mx/t² (positive is tension on the bottom). Linear through the thickness, opposite sign on the top.','Compare with the cracking stress of concrete or the yield stress of steel. It ignores in-plane stresses, which add on top.'],
 ux:['u','Displacement ux','In-plane movement in x of each point (mm). The deformed mesh shows the in-plane shape, magnified.','Use to check movement joints, bearings and drift of walls.'],
 uy:['u','Displacement uy','In-plane movement in y (mm).','For deep beams and walls it is the in-plane deflection; compare with span or height limits.'],
 um:['u','Displacement |u|','The magnitude of the in-plane movement √(ux² + uy²).','Shows where the plate moves most in its own plane.'],
 Nx:['N','Membrane force Nx','In-plane force per metre normal to sections perpendicular to x (kN/m), tension positive. Equal to σx × t.','Integrate across a cut to get the axial force and in-plane moment a section carries: walls and deep beams can be designed from the cut resultants.'],
 Ny:['N','Membrane force Ny','In-plane force per metre in y, tension positive.','Shows the compression struts and tension ties of walls and deep beams.'],
 Nxy:['N','Membrane shear Nxy','In-plane shear force per metre on x and y faces (kN/m).','Check against the in-plane shear capacity of a wall or diaphragm; cut a section to get the total shear crossing it.'],
 sx:['N','Stress σx','In-plane normal stress in x (MPa), tension positive: σx = Nx / t.','Compare with the material strength; peaks at holes and re-entrant corners are stress concentrations.'],
 sy:['N','Stress σy','In-plane normal stress in y (MPa), tension positive.','Compare with the material strength.'],
 txy:['N','Shear stress τxy','In-plane shear stress (MPa).','Compare with the shear strength (about 0.58 fy for steel).'],
 s1:['S12','Principal stress σ1','The largest normal stress at a point, on the plane where the shear stress is zero. Principal vectors show the tension trajectories.','In concrete, σ1 above the tensile strength predicts cracking perpendicular to the σ1 direction: place reinforcement along it (ties).'],
 s2:['S12','Principal stress σ2','The smallest (most compressive) principal stress, at right angles to σ1. Compression trajectories show the load paths (struts).','In deep beams the σ2 field is the compression arch of a strut-and-tie model.'],
 tmax:['S12','Maximum shear stress τmax','τmax = ½(σ1 − σ2), on planes at 45° to the principal directions.','The Tresca criterion compares 2τmax with fy.'],
 svm:['vm','Von Mises stress','An equivalent stress combining the in-plane stresses: σvm = √(σ1² − σ1σ2 + σ2²). It is always positive.','For ductile metals, compare with the yield stress fy: yielding starts where σvm reaches fy. Not appropriate for concrete or other brittle materials.']};

 const sv=M;out.push({h:'Every example: reactions balance the applied loads'});Object.entries(PRESETS).forEach(([k,p])=>{try{const m=p.f(),r=analyse(m);let e=0,f=0;if(r.hasB&&r.B.ok){let a=0,b=0;r.B.F.forEach((v,d)=>{if(d%3==0)a+=v});r.B.R.forEach((v,d)=>{if(d%3==0)b+=v});e=Math.max(e,Math.abs(a+b));f=Math.max(f,Math.abs(a))}

  out.push({name:p.t+': |ΣF + ΣR| ÷ |ΣF|',exp:0,got:e/(f||1),tol:1e-9,ok:e/(f||1)<=1e-9&&(r.hasB?r.B.ok:true)&&(r.hasM?r.Mm.ok:true),abs:true,ref:'equilibrium'})}catch(er){out.push({name:p.t+': '+er.message,exp:0,got:1,tol:0,ok:false,abs:true})}});M=sv;
 const n=out.filter(r=>!r.h).length,ok=out.filter(r=>!r.h&&r.ok).length,ms=performance.now()-t0;
 let h='<div class="vsum"><b class="'+(ok==n?'ok':'bad')+'" style="color:'+(ok==n?'#12d98a':'#ff3d5a')+'">'+ok+' / '+n+'</b> checks pass · '+Math.round(ms)+' ms</div><p class="dlgL" style="margin:0 0 6px">Each row builds a model, solves it with the same code the app uses, and compares a result with its textbook value. Tolerances reflect the mesh used: the slow-converging ones (a clamped edge moment, the stress at a hole) are noted.</p><table class="vt"><tr><th>Check</th><th>Expected</th><th>Plate Pusher</th><th>Error</th><th></th></tr>';
 out.forEach(r=>{if(r.h){h+='<tr><th class="g" colspan="5">'+r.h+'</th></tr>';return}const er=r.abs?f3(Math.abs(r.got-r.exp)):(Math.abs(r.got-r.exp)/Math.max(1e-30,Math.abs(r.exp))*100).toFixed(2)+'%';
  h+='<tr><td>'+r.name+(r.ref?' <small>· '+r.ref+'</small>':'')+'</td><td>'+f3(r.exp)+'</td><td>'+f3(r.got)+'</td><td>'+er+' <small>(≤ '+(r.abs?f3(r.tol):(r.tol*100).toPrecision(2)+'%')+')</small></td><td class="'+(r.ok?'ok':'bad')+'">'+(r.ok?'✓':'✗')+'</td></tr>'});
 $('dB').innerHTML=h+'</table>'},40)}
function showMeth(){openDlg('Method','Elements, conventions and <span>assumptions</span>','<div class="meth">'+
 '<h3>Two problems on one mesh</h3><p>A flat plate carries load in two independent ways. <b>Out-of-plane</b> loads (pressure, line and point loads) bend it; <b>in-plane</b> loads (forces and edge tractions) stretch and shear it. For a flat plate the two do not interact (linear, small deflection), so Plate Pusher solves them as two separate systems on the same mesh and shows whichever has loads.</p>'+
 '<h3>Bending: MITC4 Reissner–Mindlin plate</h3><p>Four-node quadrilateral, 3 DOFs per node: deflection <b>w</b> and the rotations of the normal <b>βx, βy</b> (u = zβx, v = zβy). Curvatures κ = ∂β, moments <b>M = D κ</b> with D = Et³/12(1−ν²). Transverse shear γ = ∇w + β uses the Bathe–Dvorkin assumed strain field tied at the edge mid-points, which removes shear locking: thin plates converge to Kirchhoff theory, thick plates include shear deformation (κ = 5/6). 2 × 2 Gauss integration.</p>'+
 '<h3>Membrane: QM6 incompatible-mode quadrilateral</h3><p>Four nodes, 2 DOFs per node (u, v), plane stress, with Wilson’s incompatible bubble modes and Taylor’s correction so it passes the patch test. The bubbles make it accurate in in-plane bending (deep beams, walls) where a plain bilinear element locks; they are condensed out inside each element.</p>'+
 '<h3>Signs and units</h3><ul><li>kN, m; E in GPa, thickness in mm; moments kNm/m, shears and membrane forces kN/m, stresses MPa, deflections mm.</li><li>z and w are positive in the direction of positive pressure, so gravity loads are positive and give positive (downward) deflection. <b>Sagging moments are positive.</b></li><li>Mx bends about the y axis (it spans in x and governs bars running in x). Mxy is the twisting moment. Qx = ∂Mx/∂x + ∂Mxy/∂y.</li><li>Membrane forces and stresses are tension positive.</li><li>Wood–Armer moments are the design moments for orthogonal x/y reinforcement: bottom M* ≥ 0, top M* ≤ 0.</li></ul>'+
 '<h3>Supports</h3><p><b>Simple, soft</b> restrains w only. <b>Simple, hard</b> also stops the rotation along the edge (horizontal or vertical edges); this is the condition of the Navier solution, and it matters for thick plates. <b>Clamped</b> restrains w and both rotations. Columns are point supports at the nearest node. Springs and elastic ground (Winkler, kN/m³) add to the stiffness diagonal. In-plane pins and rollers restrain u and v.</p>'+
 '<h3>Mesh</h3><p>A structured grid follows every horizontal and vertical edge, support, load and refinement zone; elements are kept where their centre is on the plate, and boundary nodes are moved onto curved or sloping edges (reverted where that would distort an element badly). Refinement zones refine a band right across the plate. Results are computed at the Gauss points, extrapolated to the nodes and averaged; untick <b>Averaged</b> to see the element values and how much they jump, a direct sign of discretisation error.</p>'+
 '<h3>Solver</h3><p>The nodes are renumbered by reverse Cuthill–McKee and the equations are solved by a skyline (envelope) Cholesky factorisation. A zero or negative pivot signals a mechanism, reported with the DOF where it was found. Reactions are K u − F at the restrained DOFs; their sum is checked against the applied load.</p>'+
 '<h3>Limits</h3><ul><li>Linear elastic, isotropic, constant thickness, small deflections; no membrane–bending coupling (no large deflection, no eccentric stiffeners).</li><li>Point loads and point supports give a singular moment (and, in Mindlin theory, a singular shear deflection): the peak there grows as the mesh is refined. Read moments a short distance away, or spread the load over a patch.</li><li>Re-entrant corners and the corners of openings are stress singularities in an elastic model too.</li><li>Concrete cracking, creep and reinforcement are not modelled.</li></ul></div>')}
function showKeys(){const k=TOOLS.map(([id,t,ic,key])=>'<tr><td><kbd>'+key.toUpperCase()+'</kbd></td><td>'+t+'</td></tr>').join('');openDlg('Keyboard','Keyboard <span>shortcuts</span>','<table class="vt" style="max-width:520px">'+k+'<tr><th class="g" colspan="2">General</th></tr><tr><td><kbd>Esc</kbd></td><td>cancel, then deselect, then Select tool</td></tr><tr><td><kbd>Enter</kbd> / double-click</td><td>close a polygon</td></tr><tr><td><kbd>Del</kbd></td><td>delete the selection</td></tr><tr><td><kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Y</kbd></td><td>undo / redo</td></tr><tr><td><kbd>F</kbd></td><td>fit view</td></tr><tr><td><kbd>M</kbd></td><td>stiffness matrix</td></tr><tr><td><kbd>Shift</kbd></td><td>horizontal / vertical lines; whole outline with Edge support</td></tr><tr><td><kbd>Ctrl</kbd>+<kbd>S</kbd></td><td>save / open</td></tr><tr><td><kbd>?</kbd></td><td>welcome guide</td></tr></table>')}
function openIO(){const txt=JSON.stringify({app:'Plate Pusher',v:1,model:JSON.parse(snapM(),(k,v)=>k[0]=='_'?undefined:v)});openDlg('Save / open','Save or open a <span>model</span>','<div class="io"><p class="dlgL" style="margin:0 0 8px">The model is plain JSON: geometry, supports, loads, cuts, notes and material. Copy the text and keep it in a .json file; open it again from the file or by pasting it below.</p><div class="bt"><button class="on" id="ioCp">Copy text</button><label class="fioL" style="gap:6px"><button id="ioOp">⬆ Open a file…</button><input type="file" id="ioF" accept=".json,application/json" hidden></label><button id="ioLd">Load the text below</button></div><textarea id="ioT">'+txt.replace(/</g,'&lt;')+'</textarea></div>');
  $('ioCp').onclick=()=>{try{navigator.clipboard.writeText(txt).then(()=>toast('Copied.'),()=>{$('ioT').select();toast('Copy was blocked: the text is selected, press Ctrl+C.',1)})}catch(e){$('ioT').select();toast('Copy was blocked: the text is selected, press Ctrl+C.',1)}};$('ioOp').onclick=()=>$('ioF').click();
 $('ioF').onchange=()=>{const f=$('ioF').files[0];if(!f)return;f.text().then(t=>{$('ioT').value=t;ioLoad(t)})};$('ioLd').onclick=()=>ioLoad($('ioT').value)}
function ioLoad(t){try{const o=JSON.parse(t),m=o.model||o;if(!m.shapes||!m.mat)throw new Error('not a Plate Pusher model');pushU();M=Object.assign(blankModel(),m);M.mesh=Object.assign({h:.5,zones:[]},m.mesh||{});['sups','loads','anns','cuts'].forEach(k=>M[k]=M[k]||[]);fixIds();sel=null;sideOpen(null);closeDlg();runSolve();fit();toast('Model loaded.')}catch(e){toast('Could not load: '+e.message,1)}}
function newModel(silent){if(!silent&&M.shapes.length){openDlg('New','Clear the <span>canvas</span>?','<p class="dlgL" style="margin:0 0 12px">This removes every plate, support, load, cut and note. Undo (Ctrl+Z) brings them back.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button id="nwNo">Cancel</button><button class="on" id="nwYes">Clear</button></div>');$('nwNo').onclick=closeDlg;$('nwYes').onclick=()=>{closeDlg();newModel(true)};return}pushU();M=blankModel();sel=null;poly=null;sideOpen(null);hm.el=null;R=null;setTool('plate');runSolve();S=40;ox=W*.25;oy=H*.75;draw()}
$('bGuide').onclick=showGuide;$('bGal').onclick=showGal;$('preG').onclick=showGal;$('bVer').onclick=runVer;$('bMeth').onclick=showMeth;$('bKeys').onclick=showKeys;$('bIO').onclick=openIO;$('bNew').onclick=()=>newModel();

 resize();syncTools();let loaded=false;try{const s=localStorage.getItem('pp_model');if(s){const m=JSON.parse(s);if(m&&m.shapes&&m.shapes.length){M=Object.assign(blankModel(),m);M.mesh=Object.assign({h:.5,zones:[]},m.mesh||{});fixIds();loaded=true}}}catch(e){}
 if(!loaded){M=PRESETS.ss6.f();fixIds();O.field='w'}runSolve();fit();UND=[];syncUR();
 let ng=false;try{ng=!!localStorage.getItem('pp_noguide')}catch(e){}if(!ng)showGuide()})();
